<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mboni</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===== TOKENS: the only place values are defined ===== */
:root{
  --bg:#F0F1F2; --surface:#FFFFFF; --stage:#E4E6E8; --line:#E3E4E6; --chip:#E6E7E9;
  --text:#14131A; --text-2:#6B6970; --pink:#FF2E93; --pink-deep:#C4096A;
  --font:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --t14:14px; --t16:16px; --t20:20px; --t28:28px; --t44:44px;
  --s1:4px; --s15:6px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --r1:6px; --r2:10px; --r3:14px; --r4:999px;
  --shadow:0 2px 12px rgba(20,19,26,.07); --ease:cubic-bezier(.2,.7,.2,1);
  /* context: every primitive reads these, surfaces override them */
  --sf:var(--bg); --on:var(--text); --mut:var(--text-2); --inv:var(--bg);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#101014; --surface:#1B1B20; --stage:#23232A; --line:#2E2E36; --chip:#2B2B33;
  --text:#F2F1F4; --text-2:#9D9AA3; --shadow:0 2px 12px rgba(0,0,0,.4); color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--on);font:400 var(--t16)/1.4 var(--font);-webkit-font-smoothing:antialiased}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
svg{display:block}
[data-mut]{color:var(--mut)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== PRIMITIVE 1: flow (all layout: rows, columns, grids, scroll) ===== */
/* contract: every box clips its own content, never shrinks, never lets content set its width */
[data-ui]{min-width:0;overflow:clip;flex-shrink:0}
[data-ui=flow]{display:flex;flex-direction:column;min-height:0}
[data-wrap]{flex-wrap:wrap}
[data-grid]{display:grid;align-content:start;justify-content:start}
[data-scroll]{scrollbar-width:none}
[data-scroll=x]{overflow:auto hidden} [data-scroll=y]{overflow:hidden auto}
[data-grow]{flex:1 1 0;min-height:0}
[data-span]{grid-column:1/-1}
[data-frame]{height:100%;padding:0 var(--s5) var(--s5)} /* one gutter token on the left, right and bottom */
[data-rule]{border-left:1px solid var(--mut);padding-left:var(--s5)}

/* ===== PRIMITIVE 2: surface (cards, stage, overlays) ===== */
[data-ui=surface]{position:relative;display:flex;flex-direction:column;gap:var(--s5);background:var(--sf);color:var(--on);border-radius:var(--r3);padding:var(--s5)}
[data-tone=light]{--sf:var(--surface);border:1px solid var(--line)}
[data-tone=stage]{container-type:size;gap:var(--s3);--sf:var(--stage);display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) max-content}
[data-tone=media]{--sf:rgba(20,19,26,.66);--on:#fff;--mut:rgba(255,255,255,.7);--inv:#14131A;border-radius:var(--r2);padding:var(--s3);gap:var(--s2);font-size:var(--t14);backdrop-filter:blur(10px)}
[data-pin=bl]{justify-self:start;align-self:end;max-width:100%;max-height:max(56cqh,168px)}   /* never wider than the stage, never taller than a share of it: the picture always keeps its room */
/* ===== overlay discipline: the panels scroll, the toolbar stays, every row wraps, nothing is wider than the overlay ===== */
[data-shrink]{flex-shrink:1000;min-height:0}   /* the panels give up space first... */
[data-shrink=soft]{flex-shrink:1}   /* ...the pinned toolbar only after the panels have nothing left to give, and then it scrolls rather than being cut off */
[data-scroll]:empty{display:none}
[data-tone=media] [data-ui]{max-width:100%}
[data-tone=media] [data-wrap]{row-gap:var(--s2)}
[data-tone=media] [data-scroll]{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.35) transparent}
[data-tone=media] [data-more]{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 28px),transparent)}   /* more below: the last line fades instead of being cut */
[data-tone=media] [data-ui=control]{height:36px;padding:0 var(--s15);font-size:var(--t14)}
[data-tone=media] [data-text]{padding:var(--s2) var(--s3)}
@media (max-width:900px){[data-tone=stage]{padding:var(--s3)}}

/* ===== PRIMITIVE 3: control (every button, link, field, header) ===== */
[data-ui=control]{display:inline-flex;align-items:center;gap:var(--s2);height:40px;padding:0 var(--s3);border-radius:var(--r1);font-size:var(--t16);font-weight:400;color:var(--on)}
[data-v=solid],[data-v=soft]{height:56px;padding:0 var(--s5);border-radius:var(--r2);font-weight:500;justify-content:center}
[data-v=solid]{background:var(--pink-deep);color:#fff}
[data-v=soft]{background:var(--chip)}
[data-v=icon]{width:36px;height:36px;padding:0;justify-content:center;border-radius:var(--r4);background:var(--surface);border:1px solid var(--line)}
[data-v=field]{width:100%;height:64px;padding:0 var(--s4);border:1px solid var(--line);border-radius:var(--r2);color:var(--mut)}
[data-v=head]{width:100%;height:auto;padding:0;justify-content:space-between;font-size:var(--t20);font-weight:500;border-radius:0}
[data-ui=control][aria-pressed=true]{background:var(--on);color:var(--inv)}
[data-block]{width:100%}

/* ===== PRIMITIVE 4: choice (every selectable item: swatch, thumb, card, chip) ===== */
[data-media]{container-type:inline-size}
[data-ui=choice]{position:relative;display:flex;flex-direction:column;gap:var(--s2);text-align:left;padding:0;border:1px solid color-mix(in srgb,var(--on) 14%,transparent);border-radius:var(--r1);color:var(--on)}
[data-text]{padding:var(--s3);border-radius:var(--r2)}
[data-ind]{padding-bottom:calc(var(--s3) + 44px)}
[data-ui=choice][aria-pressed=true]::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 2px var(--sf),inset 0 0 0 4px var(--on);pointer-events:none}
[data-ui=choice]>b{overflow-wrap:anywhere}
[data-ui=choice]>[data-ui=icon]{position:absolute;top:var(--s2);left:var(--s2);z-index:1}
[data-ui=choice]>b{font-weight:400}
[data-ui=radio]{position:absolute;right:var(--s3);bottom:var(--s3);width:32px;height:32px;border-radius:var(--r4);background:var(--chip)}
[aria-pressed=true]>[data-ui=radio]{background:#fff;border:9px solid var(--on)}

/* ===== PRIMITIVE 5: media (every picture: bead grid or solid color) ===== */

[data-ui=media]{position:relative;width:100%;aspect-ratio:var(--rw,1)/var(--rh,1);height:calc(100cqw*var(--rh,1)/var(--rw,1));border-radius:var(--r1);background:var(--c,var(--stage))}
[data-ui=media] svg{position:absolute;inset:10%;width:80%;height:80%}
[data-size=fill]{height:100%;aspect-ratio:auto;background:none}
[data-size=fill] svg{inset:0;width:100%;height:100%}

/* ===== PRIMITIVE 6: readout (every label + value pair) ===== */
[data-ui=readout]{display:flex;flex-direction:column;line-height:1.25}
[data-ui=readout][data-flip]{flex-direction:column-reverse}
[data-ui=readout]>.k{color:var(--mut)}
[data-size=md]>.v{font-size:var(--t20);font-weight:500} [data-size=md]>.k{font-size:var(--t14)}
[data-size=big]>.v{font-size:var(--t28)}
[data-size=tag]{flex-direction:row;align-self:center;background:var(--chip);border-radius:var(--r4);padding:2px var(--s3);font-size:var(--t14)}

/* ===== PRIMITIVE 7: text and heads (titles, links, group headers, icons) ===== */
[data-ui=text][data-v=title]{font-size:var(--t44);letter-spacing:-.02em;line-height:1.1}
[data-ui=text][data-v=link]{color:var(--on);text-decoration:underline}
[data-ui=head]{display:flex;align-items:center;gap:var(--s2);font-weight:500}
[data-ui=head][data-mut]{font-weight:400;font-size:var(--t14)}
[data-chev]{transition:transform 240ms var(--ease)}
[data-open] [data-chev]{transform:rotate(180deg)}
[data-ui=icon][data-i]{width:18px;height:18px;border:1.5px solid currentColor;border-radius:50%;display:inline-grid;place-items:center;font:500 11px/1 var(--font);color:var(--mut)}

@media (max-width:900px){
  [data-collapse]{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:68px minmax(300px,56vh) minmax(0,1fr)!important}
  [data-frame]{padding:0 var(--s3) var(--s3)}
  [data-ui=control][data-v=solid],[data-ui=control][data-v=soft]{height:44px;padding:0 var(--s4)}
}
input[data-ui=control]{font:inherit;color:var(--on);background:none}
[data-bar]{height:72px;border:1px solid var(--line);border-radius:var(--r1)}
[data-bar]>i{display:block;min-height:0}
input[data-ui=control]::placeholder{color:var(--mut)}
</style>
</head>
<body>
<div id="app" style="height:100%"></div>
<script>
/* ===== THE CORE: one state, one spec, one renderer ===== */
const cl=v=>JSON.parse(JSON.stringify(v));
/* ===== SCHEMA: every state key is declared once, as SHARED (one value for the whole order) or DESIGN (each earring has its own copy).
   DF, the list snap() and load() move between earrings, is derived from DESIGN, so a new key cannot be forgotten. This is also the Save/Load format ===== */
const SHARED={shape:'flat',form:'rect',item:'keychain',len:'M',wid:'M',bead:'10',ear:'0',pm:'same',mm:'orbit',emo:0,ecat:'smile',view:'v1',bg:'light',light:'studio',scene:(typeof matchMedia==='function'&&matchMedia('(max-width:900px)').matches)?0:1,real:0,three:0,open:{form:1,size:1,bead:1}};
const DESIGN={source:'text',stripes:[{c:'pink',w:1}],sel:'0',txt:'MBONI',font:'sans',textc:'bone',textbg:'ink',sat:'1',scale:1,rot:0,fh:false,fv:false,tx:0,ty:0,imgName:'',imgErr:'',imgId:0,dn:3,dsel:'0',dcol:[],dtxt:'JC',ground:'ink',outline:'none',outlinec:'bone',finish:'glossy',procBy:{image:'blended',solid:'dominant',text:'dominant'},chk:['pink','bone'],csel:'0'};
const S=cl({...SHARED,...DESIGN});

const PAL=['#FF2E93','#F4E9DA','#24242C','#4CC3A5','#F2B33D','#5B7CFA','#D9DCE0'];
const price=p=>typeof p==='string'?p:'Standard';
const PATH={up:'M12 19V5M6 11l6-6 6 6',down:'M12 5v14M6 13l6 6 6-6',left:'M19 12H5M11 6l-6 6 6 6',right:'M5 12h14M13 6l6 6-6 6',center:'M12 3v4M12 17v4M3 12h4M17 12h4M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6',minus:'M5 12h14',plus:'M12 5v14M5 12h14',chev:'M6 9l6 6 6-6',back:'M20 12H4M10 6l-6 6 6 6',save:'M6 3h12v18l-6-4.5L6 21z',load:'M4 12a8 8 0 1 0 3-6.2M4 4v4h4',
  search:'M15 15l5 5M16 10a6 6 0 1 1-12 0 6 6 0 0 1 12 0',expand:'M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7',next:'M9 5l7 7-7 7'};
const ic=k=>k==='info'?'<span data-ui="icon" data-i>i</span>'
  :`<svg ${k==='chev'?'data-chev ':''}width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="${PATH[k]}"/></svg>`;
const T=t=>typeof t==='number'?`repeat(${t},minmax(0,1fr))`:t.map(x=>x==='f'?'minmax(0,1fr)':x==='h'?'minmax(0,max-content)':x+'px').join(' ');
const RT=r=>{const q=String(r||1).split('/');return `--rw:${q[0]};--rh:${q[1]||1}`};
const GAP={tight:'s2',in:'s3',between:'s5'};
const V=x=>typeof x==='function'?x(S):x;

/* node builders */
const F=(p,c)=>({t:'flow',...p,c:c.filter(Boolean)}), G=(title,info,c)=>({t:'group',title,info,c}),
  B=(v,label,p={})=>({t:'control',v,label,...p}), RO=(k,v,p={})=>({t:'readout',k,v,...p}),
  SF=(tone,p,c)=>({t:'surface',tone,...p,c}), CH=(key,slots,items,p={})=>({t:'choices',key,slots,items,...p});
const mk=(arr,price,kind)=>arr.map(([id,label,x,pr])=>({id,label,price:pr!==undefined?pr:price,m:kind==='c'?{c:x}:{b:x}}));

/* ===== EARRING PAIR: each earring is its own design. S always holds the one being worked on; the other waits in D ===== */
const DF=Object.keys(DESIGN);
const D=[null,null];
const snap=()=>{const d={img:IMG};DF.forEach(k=>{d[k]=cl(S[k])});return d};
const load=d=>{DF.forEach(k=>{S[k]=cl(d[k])});IMG=d.img};
const withDesign=(d,fn)=>{const keep=snap();load(d);try{return fn()}finally{load(keep)}};
const other=()=>D[1-(+S.ear)]||snap();   /* until the second earring is edited on its own it simply matches the first */
function swapEar(id){if(S.pm!=='sep'||id===S.ear)return;const cur=snap(),next=D[+id]||cur;D[+S.ear]=cur;load(next);D[+id]=null;S.ear=id}
function clampAll(){if(S.form!=='diamond')return;clampD();const o=1-(+S.ear);if(S.item==='earring'&&D[o])withDesign(D[o],()=>{clampD();D[o]=snap()})}
const eng=()=>S.form==='rect'?bead2d():diamond2d();
const cc2=r=>r.colors||r.cells;
function pairOf(rs,act,sep,fins){   /* two earrings side by side, each turned 90deg clockwise so its length hangs vertically, in 2D and as one bead list for 3D; in Separate mode the active one is outlined */
  const w=i=>rs[i].box.y1-rs[i].box.y0,h=i=>rs[i].box.x1-rs[i].box.x0,   /* turned: the lattice's height is now its width, and its width its height */
    gap=Math.max(8,rs[0].d*4),W=w(0)+gap+w(1),H=Math.max(h(0),h(1)),cx=[-W/2+w(0)/2,W/2-w(1)/2];
  let svg='',bl=[];const parts=[];
  [0,1].forEach(i=>{const r=rs[i],bx=(r.box.x0+r.box.x1)/2,by=(r.box.y0+r.box.y1)/2;
    svg+='<g data-ear="'+i+'"'+(sep?' style="cursor:pointer"':'')+' transform="translate('+cx[i].toFixed(3)+' 0) rotate(90) translate('+(-bx).toFixed(3)+' '+(-by).toFixed(3)+')">'+r.s+'</g>';
    r.bl.forEach(b=>bl.push({x:-b.y+cx[i],y:b.x,a:b.a+Math.PI/2,c:b.c,f:fins[i]}));parts.push({colors:cc2(r),fin:fins[i]})});   /* (x,y) -> (-y,x) is the same quarter turn the SVG group makes */
  if(sep)svg+='<rect data-hl x="'+(cx[act]-w(act)/2-1.5).toFixed(2)+'" y="'+(-h(act)/2-1.5).toFixed(2)+'" width="'+(w(act)+3).toFixed(2)+'" height="'+(h(act)+3).toFixed(2)+'" rx="1.5" fill="none" stroke="#FF2E93" stroke-width=".5" pointer-events="none"/>';
  return{vb:(-W/2-5)+' '+(-H/2-5)+' '+(W+10)+' '+(H+10),s:svg,d:rs[0].d,p:rs[0].p,bl,parts}}
const SCN={k:'',v:null};   /* the scene object keeps its identity until something it shows changes, so the 3D only rebuilds when it must */
function scene2d(){
  const fin=S.finish;let k,v;
  if(S.item!=='earring'){const r=S.form==='rect'&&S.source==='image'&&!IMG?null:eng();if(!r)return null;
    k=r.id+'|'+fin;if(SCN.k===k)return SCN.v;v={vb:r.vb,s:r.s,d:r.d,p:r.p,bl:r.bl,parts:[{colors:cc2(r),fin}]}}
  else{const a=+S.ear,sep=S.pm==='sep',oth=other(),rs=[null,null],fins=[];rs[a]=eng();rs[1-a]=withDesign(oth,eng);fins[a]=fin;fins[1-a]=oth.finish;
    k=[rs[0].id,rs[1].id,sep?a:-1,fins.join()].join('|');if(SCN.k===k)return SCN.v;v=pairOf(rs,a,sep,fins)}
  SCN.k=k;return SCN.v=v}

/* ===== PRICING (KES): the numbers to edit. Everything shown on screen follows from this block ===== */
const PRICE={bead:.5,step:50,min:50};   /* sale price per bead (cost is about 0.35); the total is rounded UP to the next `step`, never below `min` */
const FINM={matte:1,glossy:1.1,glass:1.25,metal:1.5};   /* finish multipliers: PLACEHOLDERS until you set the real ones */
const COLM={};   /* color multipliers by palette hex, e.g. '#c9942f':1.2; any color not listed counts as 1 */
const kes=(v,d=2)=>'KES '+v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const PRICING={PRICE,FINM,COLM};
function priceOf(parts,fallbackBeads,finish,cfg=PRICING){   /* pure: a design's bead lists in, numbers out; nothing here reads the page. This is the part a server re-runs */
  const{PRICE:P,FINM:F_,COLM:C}=cfg;let n=0,base=0,colorAdj=0,finAdj=0,raw=0;
  if(parts)parts.forEach(pt=>{const b=pt.colors.length*P.bead,c=pt.colors.reduce((a,x)=>a+P.bead*(C[x]||1),0),f=F_[pt.fin]||1;n+=pt.colors.length;base+=b;colorAdj+=c-b;finAdj+=c*(f-1);raw+=c*f});
  else{n=fallbackBeads;base=n*P.bead;raw=base*(F_[finish]||1);finAdj=raw-base}
  const total=Math.max(P.min,Math.ceil(raw/P.step-1e-9)*P.step);   /* the 1e-9 stops float noise (350.00000000000006) bumping an exact multiple up a step */
  return{n,base,fin:F_[finish]||1,colorAdj,finAdj,round:total-raw,total}}
function beadCounts(parts){const o={};parts.forEach(pt=>pt.colors.forEach(h=>{const k=BEAD_NAME[h]||h;o[k]=(o[k]||0)+1}));return o}   /* "Apple Red": 312, for the kit order. Not shown anywhere yet */
function quote(){const sc=scene2d();return priceOf(sc?sc.parts:null,sc?0:(S.form==='rect'?lay().cols*lay().rows:dc(S.dn).beads),S.finish)}

/* data: the only place content lives */
const cards=(key,ids,slots='mlpi')=>CH(key,slots,mk(ids,undefined,'b'),{cols:2,ind:1,ratio:'4/3'});
const tiles=(key,ids,cols,ratio)=>CH(key,'ml',mk(ids,undefined,'b'),{cols,ratio});
const swatches=(key,a)=>CH(key,'m',mk(a,0,'c'),{cols:5,ratio:1});
const opts=(key,a,cols)=>CH(key,'l',a.map(([id,label])=>({id,label})),{cols});

const OPQ=[['pink','Pink','#FF2E93'],['bone','Bone','#F4E9DA'],['ink','Ink','#24242C'],['red','Red','#E9462E'],['amber','Amber','#F2B33D'],['green','Green','#2F6B4F'],['blue','Blue','#5B7CFA'],['brown','Brown','#8A5A3C'],['gray','Gray','#9AA0A6'],['white','White','#FFFFFF']];
const GRD=[['ink','Ink','#24242C'],['navy','Navy','#1F2A44'],['forest','Forest','#1F3A2E'],['wine','Wine','#4A1F2E'],['bone','Bone','#F4E9DA'],['white','White','#FFFFFF'],['sand','Sand','#E8D3B0'],['blush','Blush','#F7C6DD'],['sky','Sky','#BFE7F3'],['stone','Stone','#9AA0A6']];
const BEADS=[['5','5/0',[4,3]],['6','6/0',[5,3]],['8','8/0',[6,4]],['10','10/0',[8,5]],['11','11/0',[9,5]],['12','12/0',[10,6]],['13','13/0',[11,7]],['15','15/0',[12,8]]];
const VIEWS=mk([['v1','Front',[42,8]],['v2','Close-up',[14,3]],['v3','Flat',[36,6]],['v4','Worn',[42,8]],['v5','Side',[30,6]],['v6','Top',[26,5]]],undefined,'b');
const step=(n,t)=>n+'. '+t;
const EMO={smile:'😀😁😂😅😉😊😍😎🤔😭😡🥳'.match(/\p{Extended_Pictographic}/gu),hearts:['❤️','🧡','💛','💚','💙','💜','🖤','🤍','💕','💖','💔','💘'],
  animal:'🐶🐱🦊🐻🐼🦁🐸🐵🦋🐢🦄🐝'.match(/\p{Extended_Pictographic}/gu),nature:['🌸','🌻','🌵','🌲','🍀','🌈','⭐','🌙','☀️','⚡','🔥','❄️'],
  object:'🎉🎈🎵💎🔑📌💡🎯🏆🚀⚓🎨'.match(/\p{Extended_Pictographic}/gu),
  flag:['🇰🇪','🇺🇸','🇬🇧','🇩🇪','🇫🇷','🇮🇹','🇪🇸','🇯🇵','🇨🇳','🇮🇳','🇧🇷','🇲🇽','🇨🇦','🇦🇺','🇳🇬','🇿🇦','🇪🇬','🇬🇭','🇪🇹','🇹🇿','🇷🇺','🇵🇹','🇳🇱','🇸🇪','🇳🇴','🇩🇰','🇫🇮','🇵🇱','🇺🇦','🇦🇷','🇨🇴','🇨🇱','🇵🇪','🇻🇪','🇮🇩','🇵🇭','🇹🇭','🇻🇳','🇰🇷','🇸🇦']};

/* the whole interface as data */

/* behavior: every interaction changes state, then redraws. No other logic. */
const app=document.getElementById('app');
let PREV=null;
function paint(tree){   /* the page has three regions (header, stage, rail). Each is re-parsed only if its HTML changed, so a rail-only click no longer rebuilds the thousands of bead rects in the stage */
  const parts=tree.c.map(R),root=app.firstElementChild;
  if(!root||!PREV||PREV.length!==parts.length||root.children.length!==parts.length){app.innerHTML=R(tree);PREV=parts;return}
  const t=document.createElement('template');
  parts.forEach((h,i)=>{if(h===PREV[i])return;t.innerHTML=h;root.children[i].replaceWith(t.content.firstElementChild)});
  PREV=parts}
function draw(){
  const sc=[...app.querySelectorAll('[data-scroll]')].map(e=>[e.scrollTop,e.scrollLeft]);
  const f=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.fid;const ss=document.activeElement&&document.activeElement.selectionStart;
  clampAll();const tree=build();sets=[];walk(tree);paint(tree);attach3();
  app.querySelectorAll('[data-scroll]').forEach((e,i)=>{if(sc[i]){e.scrollTop=sc[i][0];e.scrollLeft=sc[i][1]}});
  if(f){const e=app.querySelector(`[data-fid="${f}"]`);if(e){e.focus();if(ss!=null&&e.setSelectionRange)e.setSelectionRange(ss,ss)}}

  if(location.hash==='#audit')audit()
}

app.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.in){const q=t.dataset.in;S[q]=Array.from(t.value).slice(0,q==='dtxt'?S.dn:24).join('');draw()}});

  const eg=e.target.closest&&e.target.closest('[data-ear]');if(eg&&S.pm==='sep'){put('ear',eg.dataset.ear);return draw()}   /* click an earring on the stage to work on it */

function audit(){

/* ===== SELF-TEST: open the page with #selftest. Runs a matrix of states through the engines and the UI tree.

   A refactor must keep ENGINE identical; UI changes only when the interface itself was changed on purpose ===== */
const LEGACY_DF='source,stripes,sel,txt,font,textc,textbg,sat,scale,rot,fh,fv,tx,ty,imgName,imgErr,imgId,dn,dsel,dcol,dtxt,ground,outline,outlinec,finish,procBy'.split(',');

    const n=i++;

      put('form',form);put('item',item);put('source',source);put('bead',bead);put('outline',outline);
      put('len',L3[n%3]);put('wid',L3[(n>>1)%3]);put('finish',['matte','glossy','glass','metal'][n%4]);put('proc',['dominant','blended'][n%2]);
      if(source==='solid')S.stripes=[{c:'pink',w:2},{c:'blue',w:1},{c:'amber',w:3}];

      S.dn=2+n%4;S.dcol=['pink','bone','red','green']})}

      put('len',L3[n%3]);put('wid',L3[(n>>1)%3]);put('finish',['matte','glossy','glass','metal'][n%4]);S.chk=CK.slice(0,k);S.csel='0';S.dn=2+n%4})}
